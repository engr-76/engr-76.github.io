<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8c1515">
  <title>ENGR 76</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #252525;
      background: #f7f6f3;
      line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 760px; margin: auto; padding: 58px 24px 36px; }
    header { margin-bottom: 32px; }
    header::before {
      content: "";
      display: block;
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: #8c1515;
    }
    h1 {
      margin: 20px 0 0;
      font-size: clamp(2rem, 5.7vw, 3rem);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.15;
    }
    .project-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 28px;
      border: 1px solid #e3ded6;
      border-radius: 16px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 32px #33221106;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #8c1515;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h2 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-weight: 650;
      letter-spacing: -.025em;
      line-height: 1.25;
      overflow-wrap: anywhere;
      text-decoration: underline;
      text-decoration-color: #e3ded6;
      text-underline-offset: .18em;
    }
    .description { margin: 12px 0 0; color: #5e5b57; }
    .arrow { color: #8c1515; font-size: 1.75rem; line-height: 1; }
    .project-card:hover { border-color: #8c1515; background: #fbfaf8; }
    .project-card:hover h2 { text-decoration-color: #8c1515; }
    .project-card:focus-visible { outline: 3px solid #18758c; outline-offset: 4px; }
    @media (max-width: 480px) {
      main { padding: 30px 16px 28px; }
      .project-card { padding: 24px 20px; gap: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ENGR 76</h1>
    </header>
    <a class="project-card" href="./project2a/" aria-labelledby="project-number project-title" aria-describedby="project-description">
      <div>
        <p class="eyebrow" id="project-number">Project 2a</p>
        <h2 id="project-title">Messages through sound</h2>
        <p class="description" id="project-description">Encode and send a message using sound.</p>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>
</body>
</html>
